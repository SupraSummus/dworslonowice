<text x="20" y="894" font-size="12" fill="#555">Czerwone krzyżyki: wysokości NMT (m n.p.m.). Teren praktycznie płaski — 161,0–161,7 m, lekki spadek ku zachodowi.</text>
<text x="20" y="912" font-size="12" fill="#555">Zieleń: zadrzewienia wg ortofotomapy (orientacyjnie). Niebieskie kontury: system wodny — rozmieszczenie orientacyjne.</text>
<text x="20" y="930" font-size="12" fill="#555">Strzałki kropkowane: deszczówka z rynien; ciągłe: obieg pompa → filtr → strumyk → sadzawka; brązowa kropkowana: oś widokowa.</text>
<text x="20" y="952" font-size="10" fill="#999">Granice działek i obrysy budynków: ULDK/GUGiK; wysokości: NMT GUGiK; zadrzewienia: ortofotomapa geoportal.gov.pl (stan na 2026).</text>
